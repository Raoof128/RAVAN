name: Ravan
configs:
  PersonalPaired: debug
  StoreFiles: release
  StorePaired: release
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en-AU
  createIntermediateGroups: true
  defaultConfig: PersonalPaired
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 2
  configs:
    PersonalPaired:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG PAIRED"
    StorePaired:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PAIRED"
targets:
  Ravan:
    type: application
    platform: iOS
    sources:
      - Ravan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.ravan.cinema
        PRODUCT_NAME: Ravan
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: RAVĀN
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: RavanRibbon
      configs:
        PersonalPaired:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) */Strings/Files/Localizable.xcstrings"
          PRODUCT_BUNDLE_IDENTIFIER: au.ravan.cinema.personal
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the personal cinema server you choose on your network.
        StoreFiles:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) */Strings/Paired/Localizable.xcstrings"
        StorePaired:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) */Strings/Files/Localizable.xcstrings"
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the personal cinema server you choose on your network.
  RavanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RavanTests
      - path: ../../packages/contracts/fixtures/apple-v1
        type: folder
        buildPhase: resources
    dependencies:
      - target: Ravan
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: au.ravan.cinema.tests
      GENERATE_INFOPLIST_FILE: YES
  RavanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RavanUITests]
    dependencies:
      - target: Ravan
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: au.ravan.cinema.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Ravan
schemes:
  Ravan:
    build:
      targets:
        Ravan: all
    run:
      config: PersonalPaired
    test:
      config: PersonalPaired
      testPlans:
        - path: Ravan.xctestplan
          defaultPlan: true
    archive:
      config: StoreFiles
